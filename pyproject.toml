[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksvd-pgd"
version = "0.1.0"
description = "Reproducible experiments for fixed-damping PSD factorization"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
precision = ["mpmath>=1.3"]

[project.scripts]
ksvd-run = "ksvd.cli:main"
ksvd-plot = "ksvd.plotting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.package-data]
ksvd = ["presets/*.json"]
